name: TextSentry
options:
  bundleIdPrefix: org.textsentry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  TextSentry:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.textsentry.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TextSentry.entitlements
    dependencies:
      - target: TextSentryMessageFilter
        embed: true
  TextSentryMessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.textsentry.ios.messagefilter
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/MessageFilter.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
  TextSentryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TextSentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.textsentry.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  TextSentry:
    build:
      targets:
        TextSentry: all
    test:
      targets:
        - TextSentryTests
